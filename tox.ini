[tox]
envlist = py311,py312,py313,py314
isolated_build = True

[testenv]
deps =
    pytest>=6.0
    pytest-cov
extras = dev
commands =
    pytest -m "not integration" {posargs}

[testenv:lint]
deps =
    ruff
commands =
    ruff check NASADEM tests

[testenv:format]
deps =
    ruff
commands =
    ruff format NASADEM tests
